<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prizm Kitchen</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <header class="app-header">
    <div class="header-left">
      <span class="icon">☕</span>
      <h1>Prizm Kitchen</h1>
    </div>
    <div class="header-right">
      <span class="badge-count" id="ticketCount">0</span>
      <span class="status-dot" id="statusDot" title="Disconnected"></span>
      <button class="btn-logout" id="logoutBtn">Sign Out</button>
    </div>
  </header>

  <div class="toolbar">
    <span class="sort-label">Oldest orders first</span>
    <div class="toolbar-actions">
      <button class="btn-timers" id="timersToggle" type="button" aria-pressed="true">Timers: On</button>
      <button class="btn-recipes" id="recipesBtn" type="button">Recipes</button>
      <button class="btn-new-order" id="newOrderBtn">+ New Order</button>
      <button class="btn-test" id="testBtn" style="display:none">+ Test</button>
    </div>
  </div>

  <main class="tickets-container" id="ticketsContainer">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🟢</div>
      <p>No pending orders</p>
      <small>New orders will appear here automatically</small>
    </div>
  </main>

  <section class="delivered-section" id="deliveredSection">
    <button class="delivered-toggle" id="deliveredToggle">
      <span>Completed Orders</span>
      <span class="delivered-count" id="deliveredCount"></span>
      <span class="toggle-arrow" id="toggleArrow">▶</span>
    </button>
    <div class="delivered-list" id="deliveredList" style="display:none"></div>
  </section>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="manualOrderTitle" tabindex="-1">
      <div class="modal-header">
        <h2 id="manualOrderTitle">New Manual Order</h2>
        <button class="modal-close" id="modalClose" type="button" aria-label="Close new order">✕</button>
      </div>
      <div class="modal-body">
        <label class="field-label">Customer Name <span class="optional">(optional)</span></label>
        <input type="text" id="mCustomerName" placeholder="e.g. Sarah" class="field-input">

        <label class="field-label">Order Note <span class="optional">(optional)</span></label>
        <input type="text" id="mOrderNote" placeholder="e.g. Extra hot, no whip" class="field-input">

        <label class="field-label">Items</label>
        <div id="mItems"></div>
        <button class="btn-add-item" id="addItemBtn">+ Add Item</button>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="modalCancel">Cancel</button>
        <button class="btn-submit" id="modalSubmit">Create Ticket</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="recipeViewOverlay">
    <div class="modal recipe-view-modal" role="dialog" aria-modal="true" aria-labelledby="recipeViewTitle" tabindex="-1">
      <div class="modal-header">
        <div>
          <span class="recipe-eyebrow">DRINK RECIPE</span>
          <h2 id="recipeViewTitle"></h2>
        </div>
        <button class="modal-close" id="recipeViewClose" type="button" aria-label="Close recipe">✕</button>
      </div>
      <div class="modal-body">
        <p class="recipe-instructions" id="recipeViewInstructions" role="status" aria-live="polite"></p>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="recipesOverlay">
    <div class="modal recipes-modal" role="dialog" aria-modal="true" aria-labelledby="recipesTitle" tabindex="-1">
      <div class="modal-header">
        <div>
          <span class="recipe-eyebrow">BARISTA REFERENCE</span>
          <h2 id="recipesTitle">Recipes</h2>
        </div>
        <button class="modal-close" id="recipesClose" type="button" aria-label="Close recipes">✕</button>
      </div>
      <div class="modal-body recipes-body">
        <p class="recipe-feedback" id="recipesFeedback" role="status" aria-live="polite"></p>
        <div class="recipes-list" id="recipesList"></div>
        <form id="recipeForm" class="recipe-form">
          <h3 id="recipeFormTitle">Add a recipe</h3>
          <div class="square-picker-header">
            <label class="field-label" for="squareItems">Choose a Square item</label>
            <button class="btn-refresh-items" id="refreshSquareItems" type="button">Refresh Square items</button>
          </div>
          <select class="field-input" id="squareItems" aria-describedby="squareItemsStatus" disabled>
            <option value="">Loading Square items…</option>
          </select>
          <p class="square-items-status" id="squareItemsStatus" role="status" aria-live="polite"></p>
          <label class="field-label" for="recipeName">Drink name <span class="optional">(or enter manually)</span></label>
          <input class="field-input" type="text" id="recipeName" maxlength="120" required autocomplete="off" placeholder="e.g. Honey oat latte">
          <label class="field-label" for="recipeInstructions">Instructions</label>
          <textarea class="field-input recipe-textarea" id="recipeInstructions" required rows="6" placeholder="Ingredients, steps, and finishing touches"></textarea>
          <div class="recipe-form-actions">
            <button class="btn-cancel" id="recipeCancelEdit" type="button" hidden>Cancel edit</button>
            <button class="btn-submit" id="recipeSave" type="submit">Save recipe</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
